<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;font-family:Inter}</style></head><body>
<!-- A: CN monogram (C wraps N) -->
<div id="mono-cn" style="width:1080px;height:1080px;background:linear-gradient(135deg,#0F5C57,#062E2C)">
<svg width="1080" height="1080" viewBox="0 0 1080 1080">
 <defs><linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F0D48E"/><stop offset="1" stop-color="#B98A35"/></linearGradient></defs>
 <!-- C as thick arc -->
 <path d="M 720 300 A 260 260 0 1 0 720 700" fill="none" stroke="url(#gold)" stroke-width="70" stroke-linecap="round"/>
 <!-- N -->
 <path d="M 450 660 L 450 340 L 650 660 L 650 340" fill="none" stroke="#FFFFFF" stroke-width="62" stroke-linecap="round" stroke-linejoin="round"/>
 <text x="540" y="940" text-anchor="middle" font-family="Inter Display" font-weight="800" font-size="64" fill="#fff" letter-spacing="18">COACH NAS</text>
 <text x="540" y="1010" text-anchor="middle" font-family="Inter Display" font-weight="700" font-size="40" fill="#E9C77B" letter-spacing="3">#misifightobesiti</text>
</svg></div>

<!-- B: wordmark lowercase -->
<div id="wordmark" style="width:1600px;height:600px;background:#FAFBF8">
<svg width="1600" height="600" viewBox="0 0 1600 600">
 <text x="800" y="300" text-anchor="middle" font-family="Inter Display" font-weight="900" font-size="200" fill="#0A4744" letter-spacing="-6">coach<tspan fill="#C9A24E">.</tspan>nas</text>
 <rect x="640" y="350" width="320" height="5" rx="2.5" fill="#C9A24E"/>
 <text x="800" y="430" text-anchor="middle" font-family="Inter Display" font-weight="800" font-size="56" fill="#1E9A66" letter-spacing="2">#misifightobesiti</text>
 <text x="800" y="500" text-anchor="middle" font-family="Inter" font-weight="600" font-size="24" fill="#4F6B68" letter-spacing="7">CLINICAL PHARMACIST · WELLNESS COACH</text>
</svg></div>

<!-- C: stacked bold -->
<div id="stacked" style="width:1080px;height:1080px;background:#0A4744">
<svg width="1080" height="1080" viewBox="0 0 1080 1080">
 <rect x="150" y="150" width="780" height="780" rx="40" fill="none" stroke="#C9A24E" stroke-width="5"/>
 <text x="540" y="470" text-anchor="middle" font-family="Inter Display" font-weight="900" font-size="170" fill="#fff" letter-spacing="4">COACH</text>
 <text x="560" y="700" text-anchor="middle" font-family="Inter Display" font-weight="900" font-size="200" fill="#3CC48A" letter-spacing="40">NAS</text>
 <text x="540" y="820" text-anchor="middle" font-family="Inter Display" font-weight="700" font-size="50" fill="#E9C77B" letter-spacing="3">#misifightobesiti</text>
</svg></div>
</body></html>
